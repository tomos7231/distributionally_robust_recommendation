[project]
name = "distributionally-robust-recommendation"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "tomos7231"}
]
dependencies = [
    "pandas>=2.2.2",
    "mosek==11.0.6",
    "pydantic>=2.8.2",
    "loguru>=0.7.2",
    "hydra-core>=1.3.2",
    "scikit-learn>=1.5.1",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.5",
    "scikit-surprise>=1.1.4",
    "numpy>=1.23.2,<2.0",
    "cvxpy>=1.5.3",
    "seaborn>=0.13.2",
    "gurobipy>=11.0.3",
    "japanize-matplotlib>=1.1.3",
    "pyscipopt>=5.2.1",
    "ruff==0.5.3",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.3",
    "ruff>=0.5.1",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle warnings
    "I", # isort
]
ignore = [
    "E501", # line too long
]

[tool.ruff]
include = ["*.ipynb", "*.py"]
line-length = 120


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/distributionally_robust_recommendation"]
